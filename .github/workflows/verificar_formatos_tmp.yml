name: TMP - Verificar formatos Carteira_Planejador (read-only)

# Workflow TEMPORARIO de diagnostico. Nao escreve nada, so le.
# Mostra o numberFormat das colunas de data do Carteira_Planejador
# (linhas 1-6 e 22) em cada planilha. Remover depois da validacao.

on:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verificar formatos
        env:
          GOOGLE_CREDENTIALS_B64: ${{ secrets.GOOGLE_CREDENTIALS_B64 }}
          LISTA_PLANILHAS_SPREADSHEET_ID: "1kMJedysNlxxPU2PtCwICHlBbZVL4YpvyHSsR7Xl71Ig"
          PYTHONUNBUFFERED: "1"
        run: |
          python -u - <<'PYEOF'
          import time

          from common import (
              LISTA_PLANILHAS_SPREADSHEET_ID,
              buscar_planilhas,
              executar_com_retry,
              get_gspread_client,
          )

          client = get_gspread_client()
          ss_lista = executar_com_retry(lambda: client.open_by_key(LISTA_PLANILHAS_SPREADSHEET_ID))
          planilhas = buscar_planilhas(ss_lista)

          colunas = ["G", "AS", "AT", "AX", "AY"]
          linhas = [1, 2, 3, 4, 5, 6, 22]

          for indice, item in enumerate(planilhas):
              if indice > 0:
                  time.sleep(8)

              ss = executar_com_retry(lambda: client.open_by_key(item["id"]))
              ranges = [f"'Carteira_Planejador'!{c}1:{c}22" for c in colunas]
              meta = executar_com_retry(lambda: ss.fetch_sheet_metadata(params={
                  "ranges": ranges,
                  "includeGridData": "true",
                  "fields": "sheets.data(startColumn,rowData.values(userEnteredFormat.numberFormat,formattedValue,effectiveValue))",
              }))
              print("=" * 70)
              print(item["nome"])
              for c, bloco in zip(colunas, meta["sheets"][0]["data"]):
                  rows = bloco.get("rowData", [])
                  for ln in linhas:
                      if ln - 1 >= len(rows):
                          continue
                      vals = rows[ln - 1].get("values", [{}])
                      v = vals[0] if vals else {}
                      nf = v.get("userEnteredFormat", {}).get("numberFormat")
                      print(f"  {c}{ln:<3} fmt={nf} | ev={v.get('effectiveValue')} | fv={v.get('formattedValue')!r}")
          PYEOF
