name: Pipeline Geral - Entrada, Carteira Planejador e Plan Principal

on:
  workflow_dispatch:

concurrency:
  # Grupo compartilhado entre TODOS os workflows que escrevem nas mesmas
  # planilhas. Impede execuções simultâneas que corromperiam os dados.
  group: planejamento-sheets-write
  cancel-in-progress: false

jobs:
  executar-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # =====================================================
      # BLOCO 1 - ENTRADA
      # =====================================================
      - name: Executar Bloco 1 - Entrada
        env:
          GOOGLE_CREDENTIALS_B64: ${{ secrets.GOOGLE_CREDENTIALS_B64 }}
          LISTA_PLANILHAS_SPREADSHEET_ID: "1kMJedysNlxxPU2PtCwICHlBbZVL4YpvyHSsR7Xl71Ig"
          ORIGEM_SPREADSHEET_ID: "1lUNIeWCddfmvJEjWJpQMtuR4oRuMsI3VImDY0xBp3Bs"
          PYTHONUNBUFFERED: "1"
        run: python -u bloco1_entrada.py

      # =====================================================
      # BLOCO 2 - CARTEIRA_PLANEJADOR
      # =====================================================
      - name: Executar Bloco 2 - Carteira Planejador
        env:
          GOOGLE_CREDENTIALS_B64: ${{ secrets.GOOGLE_CREDENTIALS_B64 }}
          LISTA_PLANILHAS_SPREADSHEET_ID: "1kMJedysNlxxPU2PtCwICHlBbZVL4YpvyHSsR7Xl71Ig"
          PYTHONUNBUFFERED: "1"
        run: python -u bloco2_carteira_planejador.py

      # =====================================================
      # BLOCO 3 - PLAN_PRINCIPAL
      # =====================================================
      - name: Executar Bloco 3 - Plan Principal
        env:
          GOOGLE_CREDENTIALS_B64: ${{ secrets.GOOGLE_CREDENTIALS_B64 }}
          LISTA_PLANILHAS_SPREADSHEET_ID: "1kMJedysNlxxPU2PtCwICHlBbZVL4YpvyHSsR7Xl71Ig"
          # Plan_Principal pode ter planilhas grandes; dá folga para o cálculo.
          CALC_TIMEOUT_SECONDS: "600"
          PYTHONUNBUFFERED: "1"
        run: python -u bloco3_plan_principal.py
