name: TMP - Verificar AX (read-only)

# Workflow TEMPORARIO de diagnostico. Nao escreve nada, so le.
# Confere Carteira_Planejador!AX (data) e AP (moeda, deve seguir intocada).
# Remover depois da validacao.

on:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar AX e AP
        env:
          GOOGLE_CREDENTIALS_B64: ${{ secrets.GOOGLE_CREDENTIALS_B64 }}
          LISTA_PLANILHAS_SPREADSHEET_ID: "1kMJedysNlxxPU2PtCwICHlBbZVL4YpvyHSsR7Xl71Ig"
          PYTHONUNBUFFERED: "1"
        run: |
          python -u - <<'PYEOF'
          import time

          from common import (
              LISTA_PLANILHAS_SPREADSHEET_ID,
              abrir_aba,
              buscar_planilhas,
              executar_com_retry,
              get_gspread_client,
              ler_range,
              ultima_linha_preenchida_por_coluna,
          )

          client = get_gspread_client()
          ss_lista = executar_com_retry(lambda: client.open_by_key(LISTA_PLANILHAS_SPREADSHEET_ID))
          planilhas = buscar_planilhas(ss_lista)


          def eh_numero(v):
              return isinstance(v, (int, float)) and not isinstance(v, bool)


          for indice, item in enumerate(planilhas):
              if indice > 0:
                  time.sleep(12)

              ss = executar_com_retry(lambda: client.open_by_key(item["id"]))
              aba = abrir_aba(ss, "Carteira_Planejador")
              last = ultima_linha_preenchida_por_coluna(aba, 13)

              if last < 6:
                  print(f"{item['nome']:<22} Carteira_Planejador sem dados.")
                  continue

              # AX:AX e AP:AP num range unico AP:AX = 1 par de leituras por planilha.
              cru = ler_range(aba, f"AP6:AX{last}", None, None, date_time_render_option="SERIAL_NUMBER")
              fmt = ler_range(aba, f"AP6:AX{last}", None, None, date_time_render_option="FORMATTED_STRING")

              for letra, col in (("AP", 0), ("AX", 8)):
                  n_data = 0
                  n_texto = 0
                  n_serial_cru = 0
                  exemplos = []

                  for i in range(len(cru)):
                      v_cru = cru[i][col] if col < len(cru[i]) else ""
                      v_fmt = fmt[i][col] if col < len(fmt[i]) else ""

                      if eh_numero(v_cru):
                          n_data += 1
                          texto_fmt = str(v_fmt).replace(".", "").replace(",", "").strip()

                          if texto_fmt.isdigit() and 20000 <= float(v_cru) <= 90000:
                              n_serial_cru += 1

                          if len(exemplos) < 2:
                              exemplos.append((v_cru, v_fmt))

                      elif isinstance(v_cru, str) and v_cru.strip():
                          n_texto += 1

                  print(
                      f"{item['nome']:<22} {letra} | num={n_data:<5} texto={n_texto:<5} "
                      f"serial-cru={n_serial_cru:<5} | ex={exemplos}"
                  )
          PYEOF
