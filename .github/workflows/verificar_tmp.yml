name: TMP - Verificar E/F Carteira_Planejador (read-only)

# Workflow TEMPORARIO, so le. Remover depois da validacao.

on:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - env:
          GOOGLE_CREDENTIALS_B64: ${{ secrets.GOOGLE_CREDENTIALS_B64 }}
          LISTA_PLANILHAS_SPREADSHEET_ID: "1kMJedysNlxxPU2PtCwICHlBbZVL4YpvyHSsR7Xl71Ig"
          PYTHONUNBUFFERED: "1"
        run: |
          python -u - <<'PYEOF'
          import time
          from collections import Counter
          from common import LISTA_PLANILHAS_SPREADSHEET_ID, buscar_planilhas, executar_com_retry, get_gspread_client
          client = get_gspread_client()
          planilhas = buscar_planilhas(executar_com_retry(lambda: client.open_by_key(LISTA_PLANILHAS_SPREADSHEET_ID)))
          for i, item in enumerate(planilhas):
              if i:
                  time.sleep(6)
              ss = executar_com_retry(lambda: client.open_by_key(item["id"]))
              meta = executar_com_retry(lambda: ss.fetch_sheet_metadata(params={
                  "ranges": ["'Carteira_Planejador'!E1:F"],
                  "includeGridData": "true",
                  "fields": "sheets.data(rowData.values(userEnteredValue.formulaValue,userEnteredFormat.numberFormat,effectiveValue,formattedValue))",
              }))
              rows = meta["sheets"][0]["data"][0].get("rowData", [])
              print("=" * 60)
              print(item["nome"])
              for c, nome in ((0, "E"), (1, "F")):
                  def cel(n):
                      vals = rows[n - 1].get("values", []) if n - 1 < len(rows) else []
                      return vals[c] if c < len(vals) else {}
                  print(f"  {nome}1 formula={cel(1).get('userEnteredValue')} fmt={cel(1).get('userEnteredFormat', {}).get('numberFormat')}")
                  print(f"  {nome}5 cabecalho={cel(5).get('formattedValue')!r}")
                  fmts = Counter()
                  tipos = Counter()
                  ex = []
                  for n in range(6, len(rows) + 1):
                      v = cel(n)
                      fmts[str(v.get("userEnteredFormat", {}).get("numberFormat"))] += 1
                      ev = v.get("effectiveValue", {})
                      if "numberValue" in ev:
                          tipos["numero"] += 1
                          if len(ex) < 4: ex.append((f"{nome}{n}", ev["numberValue"], v.get("formattedValue")))
                      elif str(ev.get("stringValue", "")).strip():
                          tipos["texto"] += 1
                          if len(ex) < 4: ex.append((f"{nome}{n}", "txt", v.get("formattedValue")))
                  print(f"  {nome}6+ formatos={dict(fmts.most_common(4))}")
                  print(f"  {nome}6+ tipos={dict(tipos)} ex={ex}")
          PYEOF
