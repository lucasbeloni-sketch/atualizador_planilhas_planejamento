name: TMP - Verificar formatos nas 10 unidades (read-only)

# Workflow TEMPORARIO, so le. Remover depois da validacao.

on:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - env:
          GOOGLE_CREDENTIALS_B64: ${{ secrets.GOOGLE_CREDENTIALS_B64 }}
          LISTA_PLANILHAS_SPREADSHEET_ID: "1kMJedysNlxxPU2PtCwICHlBbZVL4YpvyHSsR7Xl71Ig"
          PYTHONUNBUFFERED: "1"
        run: |
          python -u - <<'PYEOF'
          import time
          from collections import Counter
          from common import (LISTA_PLANILHAS_SPREADSHEET_ID, abrir_aba, buscar_planilhas,
                              executar_com_retry, get_gspread_client, ultima_linha_preenchida_por_coluna)
          client = get_gspread_client()
          planilhas = buscar_planilhas(executar_com_retry(lambda: client.open_by_key(LISTA_PLANILHAS_SPREADSHEET_ID)))

          def ler(ss, rng):
              meta = executar_com_retry(lambda: ss.fetch_sheet_metadata(params={
                  "ranges": [rng], "includeGridData": "true",
                  "fields": "sheets.data(rowData.values(userEnteredFormat.numberFormat.pattern,effectiveValue))",
              }))
              return meta["sheets"][0]["data"][0].get("rowData", [])

          def resumo(rows, ncols):
              out = []
              for c in range(ncols):
                  pads = Counter(); nums = 0
                  for r in rows:
                      vals = r.get("values", [])
                      v = vals[c] if c < len(vals) else {}
                      ev = v.get("effectiveValue", {})
                      if "numberValue" in ev:
                          nums += 1
                          pads[v.get("userEnteredFormat", {}).get("numberFormat", {}).get("pattern")] += 1
                  out.append((nums, dict(pads)))
              return out

          problemas = 0
          for i, item in enumerate(planilhas):
              if i:
                  time.sleep(10)
              ss = executar_com_retry(lambda: client.open_by_key(item["id"]))
              last = ultima_linha_preenchida_por_coluna(abrir_aba(ss, "Carteira_Planejador"), 13)
              (e, f, g) = resumo(ler(ss, f"'Carteira_Planejador'!E6:G{last}"), 3)
              (ay,) = resumo(ler(ss, f"'Carteira_Planejador'!AY6:AY{last}"), 1)
              (aj,) = resumo(ler(ss, "'Carteira'!AJ2:AJ"), 1)
              ok = (set(e[1]) <= {"0%"} and set(f[1]) <= {"0%"} and set(g[1]) <= {'mmm"/"yy" "'}
                    and ay[0] == 0 and aj[0] == 0)
              problemas += not ok
              print(f"{'OK  ' if ok else 'FALHA'} {item['nome']:<22} last={last} | E={e} F={f} G={g} | AY numeros={ay[0]} | Carteira AJ numeros={aj[0]}")
          print(f"RESULTADO: {len(planilhas) - problemas}/{len(planilhas)} OK")
          PYEOF
