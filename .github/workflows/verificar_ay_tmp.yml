name: TMP - Verificar AY (read-only)

# Workflow TEMPORARIO, so le. Remover depois da validacao.

on:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - env:
          GOOGLE_CREDENTIALS_B64: ${{ secrets.GOOGLE_CREDENTIALS_B64 }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u - <<'PYEOF'
          from collections import Counter
          from common import executar_com_retry, get_gspread_client
          client = get_gspread_client()
          def dump(ss_id, rng, rotulo):
              ss = executar_com_retry(lambda: client.open_by_key(ss_id))
              meta = executar_com_retry(lambda: ss.fetch_sheet_metadata(params={
                  "ranges": [rng],
                  "includeGridData": "true",
                  "fields": "sheets.data(rowData.values(userEnteredValue,effectiveValue,formattedValue,userEnteredFormat.numberFormat))",
              }))
              rows = meta["sheets"][0]["data"][0].get("rowData", [])
              hdr = [((r.get("values") or [{}])[0].get("formattedValue")) for r in rows[:5]]
              print(rotulo, "cabecalho linhas 1-5:", hdr)
              fmts = Counter()
              nums = []
              for j, r in enumerate(rows):
                  v = (r.get("values") or [{}])[0]
                  fmts[str(v.get("userEnteredFormat", {}).get("numberFormat"))] += 1
                  if "numberValue" in v.get("effectiveValue", {}) and j >= 4:
                      nums.append((j + 1, v.get("userEnteredValue"), v.get("formattedValue")))
              print(rotulo, "formatos:", dict(fmts.most_common(4)))
              print(rotulo, f"numeros={len(nums)} ex={nums[:8]}")
          dump("1lUNIeWCddfmvJEjWJpQMtuR4oRuMsI3VImDY0xBp3Bs", "'Carteira'!CT1:CT", "ORIGEM CT")
          dump("1oS619l3x_D1mXkvDpw8vs91G6ipZmsK83JqEIwPj7Uk", "'Carteira'!AJ1:AJ", "BRUMADO Carteira AJ")
          PYEOF
