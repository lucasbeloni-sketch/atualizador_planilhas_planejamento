name: Diagnostico Estabilizacao (read-only)

on:
  workflow_dispatch:

# Grupo separado do de escrita: este job só LÊ, não corrompe dados e não
# precisa esperar a fila de escrita.
concurrency:
  group: planejamento-sheets-diagnostico
  cancel-in-progress: false

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar diagnóstico (somente leitura)
        env:
          GOOGLE_CREDENTIALS_B64: ${{ secrets.GOOGLE_CREDENTIALS_B64 }}
          PYTHONUNBUFFERED: "1"
        run: python -u diagnostico_estabilizacao.py
