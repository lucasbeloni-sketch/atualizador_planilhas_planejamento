name: Bloco 2 - Carteira Planejador

on:
  workflow_dispatch:

concurrency:
  # Grupo compartilhado entre TODOS os workflows que escrevem nas mesmas
  # planilhas. Impede execuções simultâneas que corromperiam os dados.
  group: planejamento-sheets-write
  cancel-in-progress: false

jobs:
  executar:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Bloco 2 - Carteira Planejador
        env:
          GOOGLE_CREDENTIALS_B64: ${{ secrets.GOOGLE_CREDENTIALS_B64 }}
          LISTA_PLANILHAS_SPREADSHEET_ID: "1kMJedysNlxxPU2PtCwICHlBbZVL4YpvyHSsR7Xl71Ig"
          CALC_WAIT_SECONDS: "15"
          PYTHONUNBUFFERED: "1"
        run: python -u bloco2_carteira_planejador.py
