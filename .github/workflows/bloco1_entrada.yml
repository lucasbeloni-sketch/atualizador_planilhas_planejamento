name: Bloco 1 - Entrada

on:
  workflow_dispatch:

concurrency:
  group: bloco1-entrada
  cancel-in-progress: false

jobs:
  executar:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Bloco 1 - Entrada
        env:
          GOOGLE_CREDENTIALS_B64: ${{ secrets.GOOGLE_CREDENTIALS_B64 }}
          DEST_SPREADSHEET_ID: "1rj2V7CxbZwkan63eCeLkH9G00Gi041IZNC6vwEgq6yI"
          ORIGEM_SPREADSHEET_ID: "1lUNIeWCddfmvJEjWJpQMtuR4oRuMsI3VImDY0xBp3Bs"
          PYTHONUNBUFFERED: "1"
        run: python -u bloco1_entrada.py
